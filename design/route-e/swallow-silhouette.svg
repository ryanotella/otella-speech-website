<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1371 784" role="img" aria-label="Otella Speech + Swallow mark, single-colour silhouette">
<title>Otella Speech + Swallow — single-colour silhouette</title>
<!--
  Derived variant of swallow.svg (canonical mark) per DESIGN-LANGUAGE-GUIDE.md
  section 6. Single flat fill (ink, #3E2A1C) for 16 to 24px favicon/UI sizes,
  stamps, embroidery, and fax/monochrome output.

  Built from the canonical artwork's own 7 bird-body path contours (crown,
  breast, wing and shadow/detail regions), recoloured to ink, so the outline
  stays true to the full-colour illustration rather than substituting a
  generic bird icon. This includes the off-palette #11323b crown region,
  whose contour is preserved even though its distinct colour cannot survive
  flattening to a single-colour silhouette by definition.

  The canonical file's 8th path (fill #ecdfcd, the very first path in
  swallow.svg) is deliberately NOT included here: it is the illustration's
  own rounded-square backdrop card/canvas chip behind the bird bust, not
  part of the bird's silhouette, and including it would produce a solid
  card-shaped blob instead of a bird outline. Background here is
  transparent; do not add a fill rect.
-->
<defs>
  <mask id="eyeKnockout" maskUnits="userSpaceOnUse" x="0" y="0" width="1371" height="784">
    <rect x="0" y="0" width="1371" height="784" fill="#fff"/>
    <circle cx="692.09" cy="294.85" r="33.08" fill="#000"/>
  </mask>
</defs>
