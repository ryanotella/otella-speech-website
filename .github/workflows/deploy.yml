name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build -- --verbose

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-output
          path: |
            dist
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Sync hashed assets to S3 (immutable, long cache)
        run: |
          aws s3 sync ./dist s3://otella-speech-website \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" \
            --include "_astro/*"

      - name: Sync remaining files to S3 (always revalidate)
        run: |
          aws s3 sync ./dist s3://otella-speech-website \
            --delete \
            --cache-control "public,max-age=5,must-revalidate" \
            --exclude "_astro/*"

      - name: Invalidate CloudFront cache for non-hashed files
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*.html" "/" "/*.webmanifest" "/favicon*" "/apple-touch-icon.png" "/android-chrome*"
